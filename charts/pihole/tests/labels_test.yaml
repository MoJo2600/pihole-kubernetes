suite: extra labels and annotations
templates:
  - templates/service-dhcp.yaml
  - templates/ingress.yaml
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/configmap-adlists.yaml
  - templates/configmap-allowed.yaml
  - templates/configmap-denied.yaml
  - templates/configmap-regex.yaml
  - templates/configmap-static-dhcp.yaml
release:
  name: pihole
tests:
  - it: applies serviceDhcp.extraLabels to the DHCP service
    template: templates/service-dhcp.yaml
    set:
      serviceDhcp.enabled: true
      serviceDhcp.extraLabels:
        team: dns
    asserts:
      - equal:
          path: metadata.labels.team
          value: dns

  - it: applies ingress.extraLabels next to the standard labels
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.extraLabels:
        external-dns: pihole
    asserts:
      - equal:
          path: metadata.labels.external-dns
          value: pihole
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pihole

  - it: makes the pihole container the kubectl default container
    template: templates/deployment.yaml
    set:
      doh.enabled: true
      monitoring.sidecar.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: pihole
      - contains:
          path: spec.template.spec.containers
          content:
            name: pihole
          any: true

  - it: puts commonLabels and podLabels on the pods but not in the selector (#347)
    template: templates/deployment.yaml
    set:
      commonLabels:
        team: dns
      podLabels:
        tier: edge
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: dns
      - equal:
          path: spec.template.metadata.labels.tier
          value: edge
      - notExists:
          path: spec.selector.matchLabels.team
      - notExists:
          path: spec.selector.matchLabels.tier
      - notExists:
          path: metadata.labels.tier

  - it: uses pathType Prefix by default (#314)
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
