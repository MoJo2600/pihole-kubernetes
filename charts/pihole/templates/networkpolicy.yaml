{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # NetworkPolicy ports are the pod's (container) ports, not the Service ports.
  ingress:
    # DNS (and DHCP): clients are usually outside the cluster, so every source is allowed unless dnsFrom is set
    - ports:
        - protocol: UDP
          port: {{ .Values.dnsPort }}
        - protocol: TCP
          port: {{ .Values.dnsPort }}
        {{- if .Values.serviceDhcp.enabled }}
        - protocol: UDP
          port: {{ .Values.dhcpPort }}
        {{- end }}
      {{- with .Values.networkPolicy.ingress.dnsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Web interface and metrics
    - ports:
        - protocol: TCP
          port: {{ .Values.webHttp }}
        {{- if .Values.webHttps }}
        - protocol: TCP
          port: {{ .Values.webHttps }}
        {{- end }}
        {{- if .Values.monitoring.sidecar.enabled }}
        - protocol: TCP
          port: {{ .Values.monitoring.sidecar.port }}
        {{- end }}
        {{- if and .Values.doh.enabled .Values.doh.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.doh.metrics.port }}
        {{- end }}
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
