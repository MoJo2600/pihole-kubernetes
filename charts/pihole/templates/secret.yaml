{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "pihole.password-secret" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  {{- with .Values.admin.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.admin.password }}
  password: {{ .Values.admin.password | b64enc | quote }}
  {{- else }}
  {{- /* keep the generated password across upgrades */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pihole.password-secret" .) }}
  {{- if and $existing $existing.data $existing.data.password }}
  password: {{ $existing.data.password | quote }}
  {{- else }}
  password: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
