# Default values for pihole
# This is a YAML-formatted file
# Declare variables to be passed into your templates.

# -- Labels to add to all deployed objects, including the pods
commonLabels: {}

# -- Additional labels for the pods only
podLabels: {}

# -- The number of replicas
replicaCount: 1

# -- The `spec.strategyTpye` for updates
strategyType: RollingUpdate

# -- The maximum number of Pods that can be created over the desired number of `ReplicaSet` during updating.
maxSurge: 1

# -- The maximum number of Pods that can be unavailable during updating
maxUnavailable: 1

# -- The number of old ReplicaSets to retain to allow rollback
revisionHistoryLimit: 10

image:
  # -- the repostory to pull the image from
  repository: "pihole/pihole"
  # -- the docker tag, if left empty it will get it from the chart's appVersion
  tag: ""
  # -- the pull policy
  pullPolicy: IfNotPresent

dualStack:
  # -- set this to true to enable creation of DualStack services or creation of separate IPv6 services if `serviceDns.type` is set to `"LoadBalancer"`
  enabled: false
  # -- For LoadBalancer services: `true` creates an IPv4 service and a separate `-ipv6` service (use `annotationsIPv6`/`loadBalancerIPv6` for the IPv6 one).
  # `false` creates one dual-stack (PreferDualStack) service instead, needed for k3s ServiceLB (Klipper); list both IPs in your load balancer's annotation.
  splitLoadBalancer: true

dnsHostPort:
  # -- set this to true to enable dnsHostPort
  enabled: false
  # -- default port for this pod
  port: 53

# -- Configuration for the DNS service on port 53
serviceDns:
  # -- deploys a mixed (TCP + UDP) Service instead of separate ones
  mixedService: false

  # -- `spec.type` for the DNS Service
  type: NodePort

  # -- The port of the DNS service
  port: 53

  # -- Optional node port for the DNS service
  nodePort: ""

  # -- `spec.externalTrafficPolicy` for the DNS Service
  externalTrafficPolicy: Local

  # -- A fixed `spec.loadBalancerIP` for the DNS Service. DEPRECATED in Kubernetes 1.24+. Use `annotations` with your cloud provider's annotation instead (e.g., `metallb.universe.tf/loadBalancerIPs` for MetalLB).
  loadBalancerIP: ""
  # -- A fixed `spec.loadBalancerIP` for the IPv6 DNS Service. DEPRECATED in Kubernetes 1.24+.
  loadBalancerIPv6: ""
  # -- `spec.loadBalancerClass` for the DNS Service. Only used if type is LoadBalancer.
  loadBalancerClass: ""

  # -- Annotations for the DNS service
  annotations: {}
    # metallb.universe.tf/address-pool: network-services
    # metallb.universe.tf/allow-shared-ip: pihole-svc
  # -- Annotations for the separate IPv6 DNS Service (`dualStack.enabled` with `splitLoadBalancer`), merged over `annotations`.
  # Use it for per-family settings such as `io.cilium/lb-ipam-ips` or `metallb.io/loadBalancerIPs`.
  annotationsIPv6: {}

  # -- Labels for the DNS service
  extraLabels:
    {}

# -- Configuration for the DHCP service on port 67
serviceDhcp:
  # -- Generate a Service resource for DHCP traffic
  enabled: true

  # -- `spec.type` for the DHCP Service
  type: NodePort

  # -- The port of the DHCP service
  port: 67

  # -- Optional node port for the DHCP service
  nodePort: ""

  # -- `spec.externalTrafficPolicy` for the DHCP Service
  externalTrafficPolicy: Local

  # -- A fixed `spec.loadBalancerIP` for the DHCP Service. DEPRECATED in Kubernetes 1.24+. Use `annotations` with your cloud provider's annotation instead (e.g., `metallb.universe.tf/loadBalancerIPs` for MetalLB).
  loadBalancerIP: ""
  # -- A fixed `spec.loadBalancerIP` for the IPv6 DHCP Service. DEPRECATED in Kubernetes 1.24+.
  loadBalancerIPv6: ""
  # -- `spec.loadBalancerClass` for the DHCP Service. Only used if type is LoadBalancer.
  loadBalancerClass: ""

  # -- Annotations for the DHCP service
  annotations: {}
    # metallb.universe.tf/address-pool: network-services
    # metallb.universe.tf/allow-shared-ip: pihole-svc
  # -- Annotations for the separate IPv6 DHCP Service (`dualStack.enabled` with `splitLoadBalancer`), merged over `annotations`.
  # Use it for per-family settings such as `io.cilium/lb-ipam-ips` or `metallb.io/loadBalancerIPs`.
  annotationsIPv6: {}
  # -- Labels for the DHCP service
  extraLabels:
    {}

# -- Configuration for the web interface service
serviceWeb:
  # -- Configuration for the HTTP web interface listener
  http:
    # -- Generate a service for HTTP traffic
    enabled: true

    # -- The port of the web HTTP service
    port: 80

    # -- Optional node port for the web HTTP service
    nodePort: ""

  # -- Configuration for the HTTPS web interface listener
  https:
    # -- Generate a service for HTTPS traffic
    enabled: true

    # -- The port of the web HTTPS service
    port: 443

    # -- Optional node port for the web HTTPS service
    nodePort: ""

  # -- `spec.type` for the web interface Service
  type: ClusterIP

  # -- `spec.externalTrafficPolicy` for the web interface Service
  externalTrafficPolicy: Local

  # -- A fixed `spec.loadBalancerIP` for the web interface Service. DEPRECATED in Kubernetes 1.24+. Use `annotations` with your cloud provider's annotation instead (e.g., `metallb.universe.tf/loadBalancerIPs` for MetalLB).
  loadBalancerIP: ""
  # -- A fixed `spec.loadBalancerIP` for the IPv6 web interface Service. DEPRECATED in Kubernetes 1.24+.
  loadBalancerIPv6: ""
  # -- `spec.loadBalancerClass` for the web interface Service. Only used if type is LoadBalancer.
  loadBalancerClass: ""

  # -- Annotations for the web interface service
  annotations: {}
    # metallb.universe.tf/address-pool: network-services
    # metallb.universe.tf/allow-shared-ip: pihole-svc
  # -- Annotations for the separate IPv6 web interface Service (`dualStack.enabled` with `splitLoadBalancer`), merged over `annotations`.
  # Use it for per-family settings such as `io.cilium/lb-ipam-ips` or `metallb.io/loadBalancerIPs`.
  annotationsIPv6: {}

  # -- Labels for the web interface service
  extraLabels:
    {}

# -- Domain of the web interface. Sets Pi-hole's `webserver.domain` (FTLCONF_webserver_domain) and is added to `ingress.hosts`.
# Since FTL v6.8, `/` on any other host name returns 404 unless `webserver.serve_all` is enabled.
# Set to "" to leave both untouched.
virtualHost: pi.hole

# -- Configuration for the Ingress
ingress:
  # -- Generate a Ingress resource
  enabled: false

  # -- Specify an ingressClassName
  # ingressClassName: nginx

  # -- Annotations for the ingress
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  # -- Labels for the ingress, e.g. for the external-dns `--label-filter`
  extraLabels: {}
  path: /
  # -- `Prefix` works with every ingress controller; `ImplementationSpecific` is regex or exact match on some (e.g. Cilium)
  pathType: Prefix
  hosts:
    # virtualHost (default pi.hole) is added to these hosts automatically
    - chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #     # virtualHost is NOT added here automatically; list it if your certificate covers it
  #      - chart-example.local

# -- Gateway API HTTPRoute for the web interface, an alternative to `ingress`.
# Needs the Gateway API CRDs and a Gateway to attach to (`parentRefs`).
route:
  # -- Generate an HTTPRoute resource
  enabled: false
  # -- API version of the HTTPRoute (use `gateway.networking.k8s.io/v1beta1` on Gateway API < 1.0)
  apiVersion: gateway.networking.k8s.io/v1
  # -- Annotations for the HTTPRoute
  annotations: {}
  # -- Labels for the HTTPRoute
  extraLabels: {}
  # -- Gateways (listeners) the route attaches to
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # -- Host names of the route. `virtualHost` is added automatically.
  hostnames: []
  #  - pihole.example.com
  # -- Request matches of the route rule
  matches:
    - path:
        type: PathPrefix
        value: /
  # -- Filters applied to matching requests (e.g. RequestRedirect, RequestHeaderModifier)
  filters: []
  # -- Request timeouts of the route rule
  timeouts: {}

# -- Probes configuration
probes:
  # -- probes.liveness -- Configure the healthcheck for the ingress controller
  liveness:
    # -- Generate a liveness probe
    # 'type' defaults to command, can be set to 'httpGet' to use a HTTP GET type liveness probe.
    type: command
    # -- Custom command for the liveness probe (leave empty for default using webHttp/dnsPort)
    # Default command (checks only Pi-hole itself, not the upstream DNS servers; with redirectToHttps the API is called via https://localhost:${webHttps} with -k):
    # /bin/sh -c "curl -sf --max-time 2 http://localhost:${webHttp}/api/info/login | jq -e '.dns == true' >/dev/null && [ -n \"$(dig +short +norecurse +retry=0 +time=2 -p ${dnsPort} @127.0.0.1 pi.hole)\" ]"
    command: []
    enabled: true
    # -- wait time before trying the liveness probe (can be 0 when startup probe is enabled)
    initialDelaySeconds: 0
    # -- probe interval in seconds
    periodSeconds: 10
    # -- threshold until the probe is considered failing
    failureThreshold: 3
    # -- threshold until the probe is considered successful
    successThreshold: 1
    # -- timeout in seconds
    timeoutSeconds: 5
    # port: http
    # scheme: HTTP
  readiness:
    # -- Generate a readiness probe
    # 'type' defaults to command, can be set to 'httpGet' to use a HTTP GET type readiness probe.
    type: command
    # -- Custom command for the readiness probe (leave empty for default using webHttp/dnsPort)
    # Default command (checks only Pi-hole itself, not the upstream DNS servers; with redirectToHttps the API is called via https://localhost:${webHttps} with -k):
    # /bin/sh -c "curl -sf --max-time 2 http://localhost:${webHttp}/api/info/login | jq -e '.dns == true' >/dev/null && [ -n \"$(dig +short +norecurse +retry=0 +time=2 -p ${dnsPort} @127.0.0.1 pi.hole)\" ]"
    command: []
    enabled: true
    # -- wait time before trying the readiness probe (can be 0 when startup probe is enabled)
    initialDelaySeconds: 0
    # -- probe interval in seconds
    periodSeconds: 10
    # -- threshold until the probe is considered failing
    failureThreshold: 3
    # -- threshold until the probe is considered successful
    successThreshold: 1
    # -- timeout in seconds
    timeoutSeconds: 5
    # port: http
    # scheme: HTTP
  startup:
    # -- Generate a startup probe
    # 'type' defaults to command, can be set to 'httpGet' to use a HTTP GET type startup probe.
    # The startup probe runs before liveness/readiness probes begin.
    # Once it succeeds, liveness and readiness probes take over.
    type: command
    # -- Custom command for the startup probe (leave empty for default using webHttp/dnsPort)
    # Default command (checks only Pi-hole itself, not the upstream DNS servers; with redirectToHttps the API is called via https://localhost:${webHttps} with -k):
    # /bin/sh -c "curl -sf --max-time 2 http://localhost:${webHttp}/api/info/login | jq -e '.dns == true' >/dev/null && [ -n \"$(dig +short +norecurse +retry=0 +time=2 -p ${dnsPort} @127.0.0.1 pi.hole)\" ]"
    command: []
    enabled: true
    # -- wait time before trying the startup probe
    initialDelaySeconds: 5
    # -- probe interval in seconds
    periodSeconds: 5
    # -- threshold until the container is considered failed (30 * 5s = 150s max startup time)
    failureThreshold: 30
    # -- timeout in seconds
    timeoutSeconds: 5
    # port: http
    # scheme: HTTP

# -- We usually recommend not to specify default resources and to leave this as a conscious
# -- choice for the user. This also increases chances charts run on environments with little
# -- resources, such as Minikube. If you do want to specify resources, uncomment the following
# -- lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources: {}
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

# -- `spec.PersitentVolumeClaim` configuration
persistentVolumeClaim:
  # -- set to true to use pvc
  enabled: false

  # -- specify an existing `PersistentVolumeClaim` to use
  # existingClaim: ""

  # -- Annotations for the `PersitentVolumeClaim`
  annotations: {}

  accessModes:
    - ReadWriteOnce

  # -- volume claim size
  size: "500Mi"

  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  # storageClass: "-"

  ## If subPath is set mount a sub folder of a volume instead of the root of the volume.
  ## This is especially handy for volume plugins that don't natively support sub mounting (like glusterfs).

  ## subPath: "pihole"

# -- Node selector values
nodeSelector: {}

# -- Toleration
tolerations: []

# -- Specify a priorityClassName
# priorityClassName: ""

# Reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []
# - maxSkew: <integer>
#   topologyKey: <string>
#   whenUnsatisfiable: <string>
#   labelSelector: <object>

affinity: {}

# -- Use an existing secret for the admin password.
admin:
  # -- If set to false admin password will be disabled, password specified below and the pre-existing secret (if specified) will be ignored.
  enabled: true
  # -- Administrator password when not using an existing secret (see below)
  password: "admin"
  # -- Specify an existing secret to use as admin password
  existingSecret: ""
  # -- Specify the key inside the secret to use
  passwordKey: "password"
  # -- Specify [annotations](docs/Values.md#adminannotations) to be added to the secret
  annotations:
    # reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    # reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "external-dns"

# -- extraEnvironmentVars is a list of extra enviroment variables to set for pihole to use. You can use either scalars or project cm, secrets or pod fields via valueFrom
extraEnvVars:
  # issue 360
  FTLCONF_dns_listeningMode: 'all'
  # TZ: UTC
  # Project a variable
  # SOME_VAR:
  #   valueFrom:
  #     configMapKeyRef:
  #       key: some-var
  #       name: my-config-map

# -- extraEnvVarsSecret is a list of secrets to load in as environment variables.
extraEnvVarsSecret: {}
  # env_var:
  #   name: secret-name
  #   key: secret-key

# -- default upstream DNS 1 server to use
DNS1: "8.8.8.8"
# -- default upstream DNS 2 server to use. Set to "" to use only DNS1
DNS2: "8.8.4.4"

antiaff:
  # -- set to true to enable antiaffinity (example: 2 pihole DNS in the same cluster)
  enabled: false
  # -- Here you can set the pihole release (you set in `helm install <releasename> ...`)
  # you want to avoid
  avoidRelease: pihole1
  # -- Here you can choose between preferred or required
  strict: true
  # -- Here you can pass namespaces to be part of those inclueded in anti-affinity
  namespaces: []

doh:
  # -- set to true to enable encrypted DNS via dnscrypt-proxy (supports DoH, DoT, DNSCrypt)
  enabled: false
  # -- name
  name: "dnscrypt-proxy"
  # -- repository (using GHCR)
  repository: "ghcr.io/klutchell/dnscrypt-proxy"
  # -- image tag
  tag: 2.1.15
  # -- Pull policy
  pullPolicy: IfNotPresent
  # -- port dnscrypt-proxy listens on (must match listen_addresses in config)
  port: "5053"
  # -- Here you can pass environment variables to the dnscrypt-proxy container
  envVars: {}
  # -- Custom command to the dnscrypt-proxy container
  command: []
  # -- dnscrypt-proxy configuration (raw TOML format, mounted as /config/dnscrypt-proxy.toml)
  # -- See https://github.com/DNSCrypt/dnscrypt-proxy/wiki/Configuration for all options
  # -- Example with monitoring_ui enabled for Prometheus metrics:
  # config: |
  #   listen_addresses = ['0.0.0.0:5053']
  #   server_names = ['cloudflare', 'google']
  #   [monitoring_ui]
  #   enabled = true
  #   listen_address = '0.0.0.0:8080'
  #   prometheus_enabled = true
  config: |
    listen_addresses = ['0.0.0.0:5053']
    require_dnssec = false
    require_nolog = true
    require_nofilter = true
    dnscrypt_servers = true
    doh_servers = true
    odoh_servers = false
    ipv6_servers = false
    bootstrap_resolvers = ['9.9.9.9:53', '1.1.1.1:53']
    timeout = 5000
    keepalive = 30
    log_level = 2
    use_syslog = false
    cache = true
    cache_size = 4096
    cache_min_ttl = 2400
    cache_max_ttl = 86400
    cache_neg_min_ttl = 60
    cache_neg_max_ttl = 600

    [sources]
      [sources.'public-resolvers']
        urls = [
          'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
          'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md'
        ]
        cache_file = '/tmp/public-resolvers.md'
        minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
        refresh_delay = 73
      [sources.'relays']
        urls = [
          'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md',
          'https://download.dnscrypt.info/resolvers-list/v3/relays.md'
        ]
        cache_file = '/tmp/relays.md'
        minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
        refresh_delay = 73
  # -- Metrics port configuration (enable if you have [monitoring_ui] in your config)
  metrics:
    # -- set to true to expose the metrics port in the web Service. It is also scraped by the PodMonitor when `monitoring.podMonitor.enabled` is true
    enabled: false
    # -- port for Prometheus metrics (must match listen_address in [monitoring_ui] config)
    port: 8080
  # -- Probes configuration
  probes:
    # -- Configure the healthcheck for the dnscrypt-proxy container
    liveness:
      # -- set to true to enable liveness probe
      enabled: true
      # -- customize the liveness probe (leave empty for the default)
      # Default: tcpSocket check on the dnscrypt-proxy port. Resolving a name would depend on the upstream
      # servers, and restarting the sidecar does not help during an internet outage.
      probe: {}
      # -- defines the initial delay for the liveness probe (can be 0 when startup probe is enabled)
      initialDelaySeconds: 0
      # -- probe interval in seconds
      periodSeconds: 10
      # -- defines the failure threshold for the liveness probe
      failureThreshold: 3
      # -- threshold until the probe is considered successful
      successThreshold: 1
      # -- defines the timeout in seconds for the liveness probe
      timeoutSeconds: 5
    readiness:
      # -- set to true to enable readiness probe
      enabled: true
      # -- customize the readiness probe (leave empty for default using doh.port)
      # Default command: /usr/local/bin/dnsprobe cloudflare.com "127.0.0.1:${doh.port}"
      probe: {}
      # -- defines the initial delay for the readiness probe (can be 0 when startup probe is enabled)
      initialDelaySeconds: 0
      # -- probe interval in seconds
      periodSeconds: 10
      # -- defines the failure threshold for the readiness probe
      failureThreshold: 3
      # -- threshold until the probe is considered successful
      successThreshold: 1
      # -- defines the timeout in seconds for the readiness probe
      timeoutSeconds: 5
    startup:
      # -- set to true to enable startup probe
      enabled: true
      # -- customize the startup probe (leave empty for default using doh.port)
      # Default command: /usr/local/bin/dnsprobe cloudflare.com "127.0.0.1:${doh.port}"
      probe: {}
      # -- defines the initial delay for the startup probe
      initialDelaySeconds: 5
      # -- probe interval in seconds
      periodSeconds: 5
      # -- threshold until the container is considered failed (30 * 5s = 150s max startup time)
      failureThreshold: 30
      # -- defines the timeout in seconds for the startup probe
      timeoutSeconds: 5
# -- DNS MASQ settings
dnsmasq:
  # -- Load custom user configuration files from /etc/dnsmasq.d
  enableCustomDnsMasq: true

  # -- Add upstream dns servers. All lines will be added to the pihole dnsmasq configuration
  upstreamServers: []
  # - server=/foo.bar/192.168.178.10
  # - server=/bar.foo/192.168.178.11

  # -- Add custom dns entries to override the dns resolution. All lines will be added to the pihole dnsmasq configuration.
  customDnsEntries: []
  # - address=/foo.bar/192.168.178.10
  # - address=/bar.foo/192.168.178.11

  # -- Dnsmasq reads the /etc/hosts file to resolve ips. You can add additional entries if you like
  additionalHostsEntries: []
  # - 192.168.0.3     host4
  # - 192.168.0.4     host5

  # -- Static DHCP config
  staticDhcpEntries: []
  # staticDhcpEntries:
  # - dhcp-host=MAC_ADDRESS,IP_ADDRESS,HOSTNAME

  # -- Other options
  customSettings:
  # otherSettings: |
  #   rebind-domain-ok=/plex.direct/

  # -- Here we specify custom cname entries that should point to `A` records or
  # elements in customDnsEntries array.
  # The format should be:
  #  - cname=cname.foo.bar,foo.bar
  #  - cname=cname.bar.foo,bar.foo
  #  - cname=cname record,dns record
  customCnameEntries: []
  # Here we specify custom cname entries that should point to `A` records or
  # elements in customDnsEntries array.
  # The format should be:
  #   - cname=cname.foo.bar,foo.bar
  #   - cname=cname.bar.foo,bar.foo
  #   - cname=cname record,dns record

# -- list of adlists to import when the gravity database is first created.
# Only used on a fresh /etc/pihole (no gravity.db yet). With a persistent volume, later changes have no effect;
# manage lists in the web interface or API instead. The same applies to `allowed`, `denied` and `regex`.
adlists: {}
  # If you want to provide blocklists, add them here.
  # - https://hosts-file.net/grm.txt
  # - https://reddestdream.github.io/Projects/MinimalHosts/etc/MinimalHostsBlocker/minimalhosts

# -- list of allowed domains to import when the gravity database is first created (see `adlists`)
allowed: {}
  # If you want to provide allowed domains, add them here.
  # - clients4.google.com

# -- list of denied domains to import when the gravity database is first created (see `adlists`)
denied: {}
  # If you want to have special domains denied, add them here
  # - *.denied.com

# -- list of denied regex expressions to import when the gravity database is first created (see `adlists`)
regex: {}
  # Add regular expression patterns for denied domains
  # - (^|\.)facebook\.com$

# -- Pi-hole v6 settings, passed as `FTLCONF_<key>` environment variables (dots in the setting name become underscores).
# Settings set this way are read-only in the web interface. Use scalars or valueFrom to project ConfigMaps, Secrets or pod fields.
# See https://docs.pi-hole.net/docker/configuration/ for all keys.
# Note: since FTL v6.7.1, `misc.dnsmasq_lines` can no longer be changed through the web interface or API, only here.
ftl: {}
  # database_maxDBdays: 14
  # dns_listeningMode: ALL
  # misc_dnsmasq_lines: "rebind-domain-ok=/plex.direct/"
  # Project a variable
  # dns_reply_host_IPv4:
  #   valueFrom:
  #     fieldRef:
  #       fieldPath: status.podIP

# -- port the container should use to expose HTTP traffic
webHttp: "80"

# -- port the container should use to expose HTTPS traffic. When empty Pi-hole does not listen on HTTPS
webHttps: "443"

# -- set Pi-hole to redirect traffic sent to the HTTP port to HTTPS. Requires webHttps.
# The default probes then use HTTPS. Not compatible with monitoring.sidecar (pihole-exporter rejects Pi-hole's self-signed certificate).
redirectToHttps: false

# -- port Pi-hole listens on for DNS inside the pod (sets FTLCONF_dns_port). Change it when port 53 is taken, e.g. with hostNetwork on Talos;
# the services keep `serviceDns.port` (53) and forward to it
dnsPort: "53"

# -- container port for DHCP traffic. Pi-hole's DHCP server always listens on 67; this only changes the declared port
dhcpPort: "67"

# -- hostname of pod
hostname: ""

# -- should the container use host network
hostNetwork: "false"

# -- should container run in privileged mode
# @deprecated Use containerSecurityContext.privileged instead
privileged: "false"

# -- linux capabilities container should run with
# @deprecated Use containerSecurityContext.capabilities instead
capabilities: {}
  # add:
  # - NET_ADMIN

# -- Pod-level security context
# EXPERIMENTAL: These settings are not fully tested with all Pi-hole features!
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
#
# Pi-hole Docker image limitations:
# - Requires root at startup for: gravity database, crontab, permissions, setcap
# - runAsNonRoot, runAsUser, runAsGroup are NOT SUPPORTED
# - Pi-hole internally drops privileges after initialization
podSecurityContext: {}
  # seccompProfile:
  #   type: RuntimeDefault

# -- Container-level security context
# EXPERIMENTAL: These settings are not fully tested with all Pi-hole features!
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
#
# Why detailed capability management provides limited security benefit for Pi-hole:
# Pi-hole requires 10+ capabilities including privileged ones like NET_ADMIN,
# NET_RAW, DAC_OVERRIDE, SETUID, SETGID. This exceeds Docker's default capability
# set (NET_ADMIN and SYS_NICE are not in defaults). Dropping ALL and re-adding
# these capabilities provides minimal security improvement over defaults.
#
# Recommended: Only set privileged: false (prevents full host access)
# The seccompProfile in podSecurityContext provides additional syscall filtering.
#
# NOT SUPPORTED (Pi-hole needs root at startup):
# - runAsNonRoot: true
# - runAsUser/runAsGroup: any value
# - allowPrivilegeEscalation: false (pihole-FTL runs as the pihole user and gets its capabilities from file capabilities set with setcap)
# - readOnlyRootFilesystem: true (Pi-hole writes to /etc/pihole, /var/log, etc.)
containerSecurityContext: {}
  # privileged: false
  # capabilities:
  #   add:
  #     - NET_ADMIN
  #     - SYS_NICE

customVolumes:
  # -- set this to true to enable custom volumes
  enabled: false
  # -- any volume type can be used here
  config: {}
    # hostPath:
    #   path: "/mnt/data"

# -- any extra volumes you might want
extraVolumes: {}
  # extra-dnsmasq:
  #   configMap:
  #     name: pihole-extra-dnsmasq

# -- any extra volume mounts you might want
# Use subPath when mounting single files into /etc/pihole or /var/log/pihole: since FTL v6.8, Pi-hole no longer
# takes ownership of symlinks there (ConfigMap/Secret volumes without subPath consist of symlinks).
extraVolumeMounts: {}
  # extra-dnsmasq:
  #   mountPath: /etc/dnsmasq.d/10-extra.conf
  #   subPath: 10-extra.conf

extraContainers: []
  # - name: pihole-logwatcher
  #   image: your-registry/pihole-logwatcher
  #   imagePullPolicy: Always
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 5Mi
  #     limits:
  #       cpu: 100m
  #       memory: 5Mi
  #   volumeMounts:
  #   - name: pihole-logs
  #     mountPath: /var/log/pihole

# -- any extra kubernetes manifests you might want
extraObjects: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: pihole-extra-dnsmasq
  #   data:
  #     10-extra.conf: |
  #       rebind-domain-ok=/plex.direct/

# -- Additional annotations for the deployment
deploymentAnnotations: {}
  # reloader.stakater.com/auto: "true"

# -- Additional annotations for pods
podAnnotations: {}
  # Example below allows Prometheus to scape on metric port (requires pihole-exporter sidecar enabled)
  # prometheus.io/port: '9617'
  # prometheus.io/scrape: 'true'

# -- any initContainers you might want to run before starting pihole
extraInitContainers: []
  # - name: wait-for-network
  #   image: busybox:1.37
  #   command: ["sh", "-c", "until nslookup kubernetes.default.svc.cluster.local; do sleep 2; done"]

monitoring:
  # -- Preferably adding prometheus scrape annotations rather than enabling podMonitor.
  podMonitor:
    # -- set this to true to create a PodMonitor (requires the Prometheus Operator CRDs). Scrapes the exporter sidecar and, with `doh.metrics.enabled`, dnscrypt-proxy
    enabled: false
  # -- Sidecar configuration
  sidecar:
    # -- set this to true to enable podMonitor as sidecar
    enabled: false
    port: 9617
    image:
      # -- the repository to use
      repository: ekofr/pihole-exporter
      tag: v1.0.0
      pullPolicy: IfNotPresent
    resources:
      limits:
        memory: 128Mi
      # requests:
      #  cpu: 100m
      #  memory: 128Mi

podDnsConfig:
  enabled: true
  policy: "None"
  nameservers:
    - 127.0.0.1
    - 8.8.8.8

# -- configure a Pod Disruption Budget
podDisruptionBudget:
  # -- set to true to enable creating the PDB
  enabled: false
  # -- minimum number of pods Kubernetes should try to have running at all times
  minAvailable: 1
  # -- maximum number of pods Kubernetes will allow to be unavailable. Cannot set both `minAvailable` and `maxUnavailable`
  # maxUnavailable: 1

# -- NetworkPolicy configuration
networkPolicy:
  # -- Enable NetworkPolicy
  enabled: false
  # -- Ingress rules configuration
  ingress:
    # -- Allowed sources for ingress traffic
    from:
      - namespaceSelector: {}
      # - podSelector:
      #     matchLabels:
      #       app: my-app
      # - ipBlock:
      #     cidr: 10.0.0.0/8
  # -- Egress rules (allow DNS and HTTP/HTTPS for upstream resolution and ad list updates)
  egress:
    # Allow DNS resolution to external servers
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTP/HTTPS for downloading ad lists and updates
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Allow communication within the cluster
    - to:
        - namespaceSelector: {}

# -- ServiceAccount configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automountServiceAccountToken: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
