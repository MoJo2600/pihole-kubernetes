name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "charts/pihole/examples/**"

permissions:
  contents: read

jobs:

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.17.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --check-version-increment=false --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

  kube-linter:
    name: Lint manifests (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: charts/pihole
          config: charts/pihole/.kube-linter.yaml

  kubeconform:
    name: Validate rendered manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ["1.23.0", "1.27.0", "1.31.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.17.1

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate against Kubernetes ${{ matrix.k8s-version }}
        run: |
          crd='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          validate() {
            kubeconform -strict -summary \
              -kubernetes-version "${{ matrix.k8s-version }}" \
              -schema-location default \
              -schema-location "$crd"
          }
          # Every chart-testing scenario and every example is validated automatically,
          # so a new file in ci/ or examples/ is covered without touching this workflow.
          for f in charts/pihole/ci/*-values.yaml charts/pihole/examples/*-values.yaml; do
            echo "== $f =="
            helm template pihole charts/pihole -f "$f" | validate
          done
          # Resources the kind cluster in lint-test cannot install (no Prometheus Operator CRDs)
          echo "== podMonitor enabled =="
          helm template pihole charts/pihole --set monitoring.podMonitor.enabled=true \
            --set doh.enabled=true --set doh.metrics.enabled=true | validate
          echo "== Gateway API HTTPRoute =="
          helm template pihole charts/pihole --set route.enabled=true \
            --set 'route.parentRefs[0].name=gw' | validate
          # Dual-stack LoadBalancer services need a dual-stack cluster, which the kind install does not have
          for split in true false; do
            echo "== dual-stack LoadBalancer, splitLoadBalancer=$split =="
            helm template pihole charts/pihole --set dualStack.enabled=true \
              --set dualStack.splitLoadBalancer=$split --set serviceDns.type=LoadBalancer \
              --set serviceWeb.type=LoadBalancer --set serviceDhcp.type=LoadBalancer \
              --set serviceDns.annotationsIPv6.foo=bar | validate
          done

  unittest:
    name: Template unit tests (helm-unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same pinned image as `make unittest` in charts/pihole, so local and CI runs match.
      # HOME=/tmp: the runner uid has no home in the image; without a writable cache dir
      # helm silently skips the unittest plugin ("unknown command unittest").
      - name: Run helm-unittest
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/charts/pihole:/apps" \
            helmunittest/helm-unittest:4.3.0-1.2.1 .

