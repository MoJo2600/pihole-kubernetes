name: Update contributors

# After every merge to main, add new contributors (PR authors and Co-authored-by users)
# to .all-contributorsrc and the READMEs, and open or update a single
# "chore: update contributors" pull request. Nothing is pushed to main directly.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'MoJo2600/pihole-kubernetes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install all-contributors-cli
        run: npm ci --no-audit --no-fund

      - name: Add new contributors
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ github.token }}
        run: scripts/update-contributors.sh

      # CR_TOKEN (also used by release-please) so the PR can be created and its checks run
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.CR_TOKEN }}
          branch: chore/update-contributors
          delete-branch: true
          sign-commits: true
          add-paths: |
            .all-contributorsrc
            README.md
            charts/pihole/README.md
            charts/pihole/README.md.gotmpl
          commit-message: "chore: update contributors"
          title: "chore: update contributors"
          body: |
            New contributors found in merged pull requests and `Co-authored-by` trailers.
            Contribution types are guessed from the PR titles; adjust them in `.all-contributorsrc` before merging if needed.

            Generated by `scripts/update-contributors.sh` (workflow `contributors.yaml`).
